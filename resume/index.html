<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f1">
  <meta name="robots" content="noindex, follow">
  <title>Résumé | Abhishek Biswas</title>
  <meta name="description" content="View and download the résumé of Abhishek Biswas, Lead Product Designer.">
  <link rel="canonical" href="https://iamabhishekbiswas.com/resume/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#172724;--paper:#f4f5f1;--line:#cbd5cf;--lime:#dcf363;--teal:#008f82}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#e9ede9;color:var(--ink);font:16px/1.5 'DM Sans',sans-serif}
    a{color:inherit}
    a:focus-visible{outline:3px solid var(--teal);outline-offset:4px}
    .resume-toolbar{position:sticky;top:0;z-index:10;background:rgba(244,245,241,.9);border-bottom:1px solid rgba(23,39,36,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .26s ease}
    .resume-toolbar.is-hidden{transform:translateY(-100%)}
    .toolbar-inner{max-width:1200px;margin:auto;min-height:88px;padding:8px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .resume-back-row{max-width:1100px;margin:0 auto;padding:28px 32px 0}
    .back-link{display:inline-flex;align-items:center;gap:12px;min-height:44px;color:#34403c;text-decoration:none;font-size:.94rem;font-weight:500}
    .back-icon{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.65);transition:background .2s,border-color .2s,transform .2s}
    .back-link:hover{color:#00796e}.back-link:hover .back-icon{background:#e0ece7;border-color:#91b6a8;transform:translateX(-3px)}
    .toolbar-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:600;letter-spacing:-.025em}
    .download-link{display:inline-flex;align-items:center;gap:9px;min-height:42px;padding:9px 17px;border-radius:999px;background:linear-gradient(115deg,var(--lime),#8bdcaf);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:.88rem;font-weight:700;white-space:nowrap;text-decoration:none;transition:background .2s ease,color .2s ease,transform .2s ease}
    .download-link:hover{background:var(--ink);color:var(--lime);transform:translateY(-1px)}
    .download-link svg,.back-link svg{display:block;flex:none}
    .resume-pages{max-width:960px;margin:0 auto;padding:20px 24px 72px}
    .resume-page{margin:0 0 24px;background:#fff;box-shadow:0 8px 32px rgba(23,39,36,.09)}
    .resume-page img{display:block;width:100%;height:auto}
    .scroll-top{position:fixed;right:clamp(16px,3vw,36px);bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid rgba(220,243,99,.35);border-radius:50%;background:rgba(23,39,36,.9);color:var(--lime);box-shadow:0 7px 22px rgba(23,39,36,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .2s ease,transform .2s ease,visibility .2s ease,background .2s ease}
    .scroll-top.is-visible{opacity:1;visibility:visible;transform:translateY(0)}
    .scroll-top:hover{background:#0d574e;transform:translateY(-3px)}
    .scroll-top:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
    .scroll-top svg{display:block}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:600px){
      .toolbar-inner{min-height:72px;padding:7px 18px;gap:8px}
      .toolbar-title{font-size:.92rem}
      .resume-back-row{padding:22px 18px 0}
      .download-link{min-height:38px;padding:8px 12px;font-size:.79rem;gap:6px}
      .resume-pages{padding:18px 0 32px}
      .resume-page{margin-bottom:10px;box-shadow:none}
      .scroll-top{right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:40px;height:40px}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.resume-toolbar,.back-icon,.download-link,.scroll-top{transition:none}.back-link:hover .back-icon,.scroll-top:hover{transform:none}}
  </style>
</head>
<body>
  <header class="resume-toolbar">
    <div class="toolbar-inner">
      <span class="toolbar-title">Résumé</span>
      <a class="download-link" href="./Abhishek_Biswas_Resume_ATS.pdf" download="Abhishek_Biswas_Resume_ATS.pdf" aria-label="Download Abhishek Biswas résumé as PDF">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></svg>
        Download PDF
      </a>
    </div>
  </header>
  <div class="resume-back-row"><a class="back-link" href="/"><span class="back-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></span><span>Home</span></a></div>
  <main class="resume-pages" id="resume">
    <h1 class="sr-only">Abhishek Biswas résumé</h1>
    <a class="sr-only" href="./Abhishek_Biswas_Resume_ATS.pdf" target="_blank" rel="noopener noreferrer">Open the selectable PDF version of this résumé</a>
    <figure class="resume-page"><img src="./resume-page-1.webp" width="1816" height="2568" alt="Résumé page 1 of 2: summary and experience from IBM through Cogoport." fetchpriority="high"></figure>
    <figure class="resume-page"><img src="./resume-page-2.webp" width="1816" height="2568" alt="Résumé page 2 of 2: earlier experience, skills, education and awards." loading="lazy"></figure>
  </main>
  <button class="scroll-top" type="button" aria-label="Scroll to top" title="Back to top"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
  <script>
    const resumeHeader=document.querySelector('.resume-toolbar');
    const scrollTopButton=document.querySelector('.scroll-top');
    let lastScrollY=window.scrollY;
    let headerFramePending=false;
    window.addEventListener('scroll',()=>{
      if(headerFramePending)return;
      headerFramePending=true;
      requestAnimationFrame(()=>{
        const y=window.scrollY;
        const change=y-lastScrollY;
        if(y<=20||change<-6)resumeHeader.classList.remove('is-hidden');
        else if(y>120&&change>6&&!resumeHeader.contains(document.activeElement))resumeHeader.classList.add('is-hidden');
        scrollTopButton.classList.toggle('is-visible',y>500);
        if(y<=20||Math.abs(change)>6)lastScrollY=y;
        headerFramePending=false;
      });
    },{passive:true});
    scrollTopButton.classList.toggle('is-visible',window.scrollY>500);
    resumeHeader.addEventListener('focusin',()=>resumeHeader.classList.remove('is-hidden'));
    scrollTopButton.addEventListener('click',()=>window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'}));
  </script>
</body>
</html>
